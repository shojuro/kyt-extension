# Supabase Configuration
# Ref: https://supabase.com/docs/guides/cli/config

project_id = "svrcvfzlwhnixzuxaccf"

[api]
enabled = true

# Edge Functions Configuration
# Note: verify_jwt defaults to true, override per-function below

[functions.save_chat_turn]
verify_jwt = true

[functions.save-memory-batch]
verify_jwt = true

[functions.track-progress]
verify_jwt = false

[functions.semantic-search]
verify_jwt = true

# Stripe Integration Functions
[functions.stripe-webhook]
# IMPORTANT: Webhook uses Stripe signature verification instead of JWT
# Stripe sends webhooks directly - no Supabase auth token
verify_jwt = false

[functions.create-checkout]
# Requires authenticated user to create checkout
verify_jwt = true

[functions.billing-portal]
# Requires authenticated user to access billing portal
verify_jwt = true

# Memory search (hybrid HyDE + reranking pipeline)
[functions.search_memories]
verify_jwt = true

# Batch save chat turns (up to 50 per request)
[functions.save_chat_turn_batch]
verify_jwt = true

# Data migration (claim legacy anonymous data)
[functions.claim_user_data]
verify_jwt = true

# History Import Function
[functions.import_conversation_batch]
# Service role key required for import operations
verify_jwt = true

# Import progress upsert — in-function resolveUserId gate needs the gateway
# to verify token signatures (decodeJwtRole is forge-proof only then)
[functions.update_import_progress]
verify_jwt = true

# Backfill functions — all carry the resolveUserId service-role gate, which
# REQUIRES verify_jwt = true (deployed state was false for several of these;
# never deploy them with --no-verify-jwt)
[functions.backfill_embeddings]
verify_jwt = true

[functions.backfill_entities]
verify_jwt = true

[functions.backfill_contextual]
verify_jwt = true

[functions.backfill_gravity]
verify_jwt = true

[functions.backfill_emotions]
verify_jwt = true

[functions.backfill_preferences]
verify_jwt = true

[functions.backfill_token_counts]
verify_jwt = true
