<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Import Chat History</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      width: 350px;
      background-color: #f9fafb;
      color: #111827;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: #111827;
    }
    
    p {
      font-size: 14px;
      color: #4b5563;
      margin: 0;
      line-height: 1.5;
    }
    
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      width: 100%;
    }
    
    .btn-primary {
      background-color: #2563eb;
      color: white;
    }
    
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    
    .btn-secondary {
      background-color: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }
    
    .btn-secondary:hover {
      background-color: #e5e7eb;
    }
    
    .progress-container {
      display: none;
      margin-top: 12px;
    }
    
    .progress-bar {
      height: 8px;
      background-color: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .progress-fill {
      height: 100%;
      background-color: #2563eb;
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
    }
    
    .error {
      color: #dc2626;
      font-size: 13px;
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    
    .success {
      color: #059669;
      font-size: 13px;
      background-color: #ecfdf5;
      border: 1px solid #d1fae5;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="main-view">
    <h1>Import Chat History</h1>
    
    <div class="card">
      <p>Import your last 90 days of chat history to enable full memory recall.</p>
      
      <div style="margin-top: 12px; font-size: 13px; color: #6b7280;">
        <ul style="padding-left: 20px; margin: 0;">
          <li>Includes ChatGPT & Claude</li>
          <li>Private & Secure</li>
          <li>Runs in background</li>
        </ul>
      </div>
    </div>

    <div id="platform-select" class="card">
      <p style="margin-bottom: 12px; font-weight: 500;">Select Platform:</p>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" id="btn-chatgpt">ChatGPT</button>
        <button class="btn btn-secondary" id="btn-claude">Claude</button>
      </div>
    </div>

    <div id="status-area">
      <div class="progress-container" id="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="stats">
          <span id="progress-text">Starting...</span>
          <span id="progress-count">0 msgs</span>
        </div>
      </div>
      
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg"></div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button class="btn btn-primary" id="btn-start" disabled>Start Import</button>
      <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
    </div>
  </div>

  <script src="import-modal.js"></script>
</body>
</html>
