name: Secret Rotation Reminder

# Creates a GitHub issue monthly to remind you to rotate secrets
# Overlooked by 99% of developers: secrets should be rotated regularly

on:
  schedule:
    # First day of every month at 10am UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:

jobs:
  create-reminder:
    name: Create Rotation Reminder
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date();
            const monthNames = ["January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"];
            const month = monthNames[today.getMonth()];
            const year = today.getFullYear();

            // Check if issue already exists this month
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,secret-rotation',
              state: 'open'
            });

            if (existingIssues.data.length > 0) {
              console.log('Reminder issue already exists this month');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔐 Monthly Secret Rotation Check - ${month} ${year}`,
              body: `## Monthly Security Maintenance

            This is an automated reminder to review and rotate secrets.

            ### Checklist

            #### API Keys & Tokens
            - [ ] **OpenAI API Key** - Rotate if > 90 days old
              - Generate new key at: https://platform.openai.com/api-keys
              - Update in GitHub Secrets and local .env
            - [ ] **Supabase Service Role Key** - Check if compromised
              - Dashboard → Settings → API
            - [ ] **Supabase Access Token** - Rotate if > 90 days old
              - Generate at: https://supabase.com/dashboard/account/tokens

            #### GitHub
            - [ ] Review GitHub Actions secrets - remove unused
            - [ ] Check for any leaked secrets in recent commits

            #### Database
            - [ ] Review database users and permissions
            - [ ] Check for any suspicious access patterns in logs

            ### Why Rotate Secrets?
            - Limits damage window if a secret was leaked
            - Complies with security best practices
            - Reduces risk from forgotten/shared credentials

            ### How to Rotate
            1. Generate new secret in the service's dashboard
            2. Update GitHub Secrets: Settings → Secrets → Actions
            3. Update local .env file
            4. Verify CI/CD still works
            5. Revoke old secret

            ---
            *This issue was automatically created. Close when complete.*
            `,
              labels: ['security', 'secret-rotation', 'monthly-maintenance']
            });

            console.log('Created monthly reminder issue');
