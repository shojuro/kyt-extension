name: Deploy to Production

on:
  # Manual trigger only - production deployments should be intentional
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string
      skip_tests:
        description: 'Skip tests (emergency deploy only)'
        required: false
        type: boolean
        default: false

jobs:
  # ===========================================
  # PRE-FLIGHT CHECKS
  # ===========================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Use semver: v1.2.3"
            exit 1
          fi
          echo "Version format valid: ${{ inputs.version }}"

      - name: Check branch is main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "WARNING: Deploying from non-main branch: ${{ github.ref }}"
          fi

  # ===========================================
  # SECURITY SCAN (MANDATORY — cannot be skipped even on emergency deploys)
  # ===========================================
  security-gate:
    name: Security Gate (mandatory)
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high/critical)
        run: |
          AUDIT_RESULT=$(npm audit --json 2>/dev/null || true)
          CRITICAL=$(echo "$AUDIT_RESULT" | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$AUDIT_RESULT" | jq '.metadata.vulnerabilities.high // 0')

          echo "Vulnerabilities: critical=$CRITICAL high=$HIGH"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "BLOCKING: Critical vulnerabilities found"
            npm audit --audit-level=critical
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "WARNING: High vulnerabilities found (not blocking deploy)"
            npm audit --audit-level=high || true
          fi

      - name: Scan for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          if grep -rE "(sk-[a-zA-Z0-9]{20,}|password\s*=\s*['\"][^'\"]+['\"])" --include="*.js" --include="*.ts" --exclude-dir=node_modules .; then
            echo "BLOCKING: Potential secrets found in code"
            exit 1
          fi
          echo "No secrets detected"

      - name: Verify ESLint passes
        run: npm run lint

  # ===========================================
  # RUN FULL TEST SUITE (unless skipped)
  # ===========================================
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: [preflight]
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # ===========================================
  # DEPLOY TO PRODUCTION
  # security-gate is ALWAYS required (even when skip_tests=true)
  # ===========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [preflight, security-gate, test]
    if: ${{ always() && needs.preflight.result == 'success' && needs.security-gate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    environment: production  # Requires manual approval in GitHub settings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Production Supabase
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions to Production
        run: |
          for func_dir in supabase/functions/*/; do
            func_name=$(basename "$func_dir")
            if [[ "$func_name" != _* ]]; then
              echo "Deploying function: $func_name"
              supabase functions deploy "$func_name" --no-verify-jwt
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run database migrations
        run: |
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ===========================================
  # CREATE RELEASE TAG
  # ===========================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ inputs.version }} -m "Release ${{ inputs.version }}"
          git push origin ${{ inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # ===========================================
  # POST-DEPLOYMENT VERIFICATION
  # ===========================================
  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Health check
        run: |
          echo "Verifying production deployment..."

          # Wait for deployment to propagate
          sleep 10

          # Health check
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL_PROD }}/functions/v1/save_chat_turn" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_PROD }}" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "000")

          if [ "$RESPONSE" = "000" ]; then
            echo "Production health check failed!"
            exit 1
          fi
          echo "Production is healthy (HTTP $RESPONSE)"

      - name: Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
